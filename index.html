<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' http: https:;">
    <title>S.T.A.L.K.E.R. 2 Loadout Editor</title>
    <link rel="icon" type="image/x-icon" href="src/img/favicon.ico">
    <!-- The deferred preset UI still uses FontAwesome; editor controls use local SVG icons. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module" src="src/app.ts"></script>
</head>
<body>
    <a class="editor-skip" href="#content">Skip to editor</a>
    <div id="canvas">
        <nav id="factions_bar" aria-label="Factions">
            <button type="button" id="Generic_settings" title="Global" aria-label="Global" class="faction_item"><img src="src/img/gear.png" alt=""><span>Global</span></button>
            <button type="button" id="Neutral" title="Neutrals" aria-label="Neutrals" class="faction_item"><img src="src/img/T_icon_fraction_neutrals.png" alt=""><span>Neutrals</span></button>
            <button type="button" id="Bandit" title="Bandits" aria-label="Bandits" class="faction_item"><img src="src/img/T_icon_fraction_bandits.png" alt=""><span>Bandits</span></button>
            <button type="button" id="Mercenaries" title="Mercenaries" aria-label="Mercenaries" class="faction_item"><img src="src/img/T_icon_fraction_mercenaries.png" alt=""><span>Mercenaries</span></button>
            <button type="button" id="Scientists" title="Scientists" aria-label="Scientists" class="faction_item"><img src="src/img/T_icon_fraction_scientists.png" alt=""><span>Scientists</span></button>
            <button type="button" id="Militaries" title="Militaries" aria-label="Militaries" class="faction_item"><img src="src/img/T_icon_fraction_militaries.png" alt=""><span>Militaries</span></button>
            <button type="button" id="Monolith" title="Monolith" aria-label="Monolith" class="faction_item"><img src="src/img/T_icon_fraction_monolith.png" alt=""><span>Monolith</span></button>
            <button type="button" id="Duty" title="Duty" aria-label="Duty" class="faction_item"><img src="src/img/T_icon_fraction_duty.png" alt=""><span>Duty</span></button>
            <button type="button" id="Freedom" title="Freedom" aria-label="Freedom" class="faction_item"><img src="src/img/T_icon_fraction_freedom.png" alt=""><span>Freedom</span></button>
            <button type="button" id="Varta" title="Varta" aria-label="Varta" class="faction_item"><img src="src/img/T_icon_fraction_varta.png" alt=""><span>Varta</span></button>
            <button type="button" id="Noon" title="Noon" aria-label="Noon" class="faction_item"><img src="src/img/T_icon_fraction_noon.png" alt=""><span>Noon</span></button>
            <button type="button" id="Spark" title="Spark" aria-label="Spark" class="faction_item"><img src="src/img/T_icon_fraction_spark.png" alt=""><span>Spark</span></button>
            <button type="button" id="Corpus" title="Corps" aria-label="Corps" class="faction_item"><img src="src/img/T_icon_fraction_corps.png" alt=""><span>Corps</span></button>
        </nav>
        <div class="editor-workspace">
            <header class="editor-topbar">
                <div class="editor-brand">S.T.A.L.K.E.R. 2 <span>Loadout Editor</span></div>
                <div id="toolbar">
                    <label for="config_name" class="visually-hidden">Configuration name</label>
                    <input id="config_name" type="text" class="form-control form-control-sm" placeholder="Config name" value="My new loadout">
                    <div class="editor-toolbar-actions" role="group" aria-label="Toolbar actions">
                        <button type="button" class="btn btn-sm btn-light" id="btn_file_settings" title="Armor drop settings" aria-label="Settings"><span data-editor-icon="settings"></span>Settings</button>
                        <button type="button" class="btn btn-sm btn-light" id="btn_presets" aria-label="Presets"><span data-editor-icon="list"></span>Presets</button>
                        <div class="editor-file-actions" role="group" aria-label="Files">
                            <button type="button" class="btn btn-sm btn-light" id="btn_save_zip" aria-label="ZIP"><span data-editor-icon="zip"></span>ZIP</button>
                            <button type="button" class="btn btn-sm btn-light" id="btn_save" aria-label="PAK"><span data-editor-icon="package"></span>PAK</button>
                            <button type="button" class="btn btn-sm btn-light" id="btn_export" aria-label="Export JSON"><span data-editor-icon="export"></span>Export JSON</button>
                            <button type="button" class="btn btn-sm btn-light" id="btn_import" aria-label="Import JSON"><span data-editor-icon="import"></span>Import JSON</button>
                        </div>
                        <details class="editor-help-menu">
                            <summary class="btn btn-sm btn-light"><span data-editor-icon="help"></span>Help</summary>
                            <div class="editor-menu-panel">
                                <button type="button" class="btn btn-sm btn-light" id="btn_help" aria-label="Install"><span data-editor-icon="help"></span>Installation guide</button>
                                <button type="button" class="btn btn-sm btn-light" id="btn_todo" aria-label="To do"><span data-editor-icon="roadmap"></span>Planned features</button>
                                <button type="button" class="btn btn-sm btn-light" id="btn_info" aria-label="About"><span data-editor-icon="info"></span>About</button>
                                <a href="https://github.com/PriestSL/s2-dynamicitemgenerator-generator-web" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-light" aria-label="GitHub"><span data-editor-icon="code"></span>GitHub</a>
                            </div>
                        </details>
                    </div>
                </div>
            </header>
            <nav id="categories_bar" aria-label="Categories">
                <button type="button" id="Primary" title="Primary" class="category_item"><img src="src/img/assault-rifle.png" alt=""><span>Primary</span></button>
                <button type="button" id="Secondary" title="Secondary" class="category_item"><img src="src/img/shotgun.png" alt=""><span>Secondary <small title="Not implemented">—</small></span></button>
                <button type="button" id="Pistols" title="Pistols" class="category_item"><img src="src/img/pistol.png" alt=""><span>Pistols</span></button>
                <button type="button" id="Helmets" title="Helmets" class="category_item"><img src="src/img/helmet.png" alt=""><span>Helmets</span></button>
                <button type="button" id="Armor" title="Armor" class="category_item"><img src="src/img/body.png" alt=""><span>Armor</span></button>
                <button type="button" id="Artifacts" title="Artifacts" class="category_item"><img src="src/img/space.png" alt=""><span>Artifacts <small title="Not implemented">—</small></span></button>
                <button type="button" id="Consumables" title="Consumables" class="category_item"><img src="src/img/healthy-drink.png" alt=""><span>Consumables <small title="Not implemented">—</small></span></button>
                <button type="button" id="Ammo" title="Ammo" class="category_item"><img src="src/img/bullet.png" alt=""><span>Ammo</span></button>
                <button type="button" id="Grenades" title="Grenades" class="category_item"><img src="src/img/grenade.png" alt=""><span>Grenades</span></button>
            </nav>
            <main id="content" tabindex="-1"></main>
        </div>
    </div>
</body>
</html>
